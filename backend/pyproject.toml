[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "unit: mark a test as a unit test",
    "integration: mark a test as an integration test (requires a real Postgres)",
]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
# Raised as real modules land in Phase 1. Kept enforced from day one so
# coverage debt can never silently accumulate.
fail_under = 90

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

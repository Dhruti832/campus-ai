# Second example corpus: an unrelated docs site, using seed-URL mode
# instead of sitemap mode. Proves the engine isn't university-specific —
# swapping ACTIVE_CORPUS between this file and example-university.yaml
# changes persona, categories, and crawl scope with zero code changes.

name: example-docs
description: "Example corpus: FastAPI's public documentation site."

persona: >
  You are a helpful assistant for developers reading the FastAPI documentation.
  Answer questions using only the provided context.

rules:
  - "Use ONLY the provided context to answer the question."
  - "If the answer isn't in the context, say so plainly instead of guessing."
  - "Include short code examples from the context when they're directly relevant."

categories:
  - name: Getting Started
    url_terms: ["tutorial", "first-steps", "index"]
  - name: Deployment
    url_terms: ["deployment"]
  - name: Advanced
    url_terms: ["advanced"]

crawl:
  mode: seed_list
  sitemap_url: null
  seed_urls:
    - "https://fastapi.tiangolo.com/tutorial/"
    - "https://fastapi.tiangolo.com/tutorial/first-steps/"
    - "https://fastapi.tiangolo.com/deployment/"
  allow_patterns:
    - "^https://fastapi\\.tiangolo\\.com/"
  deny_patterns:
    - "\\.(png|jpg|svg)$"
  max_pages: 60
  max_depth: 2
  include_files: false
  file_extensions: []

chunking:
  chunk_size: 400
  chunk_overlap: 40

retrieval:
  top_k: 5

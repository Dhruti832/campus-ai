name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

defaults:
  run:
    working-directory: backend

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: unichat
          POSTGRES_PASSWORD: unichat
          POSTGRES_DB: unichat
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U unichat -d unichat"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://unichat:unichat@localhost:5432/unichat
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Apply DB schema
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          PGPASSWORD=unichat psql -h localhost -U unichat -d unichat -f ../infra/init-db/001_enable_pgvector.sql

      - name: Lint
        run: ruff check .

      - name: Test with coverage
        run: pytest --cov --cov-report=term-missing

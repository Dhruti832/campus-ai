name: E2E CI

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "e2e/**"
      - "scripts/seed_e2e_fixture.py"
      - ".github/workflows/e2e-ci.yml"

jobs:
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: unichat
          POSTGRES_PASSWORD: unichat
          POSTGRES_DB: unichat
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U unichat -d unichat"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://unichat:unichat@localhost:5432/unichat
      ADMIN_API_KEY: e2e-admin-key
      ACTIVE_CORPUS: example-docs
      LLM_PROVIDER: echo
      CORS_ORIGINS: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Apply DB schema
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          for f in infra/init-db/*.sql; do
            echo "Applying $f"
            PGPASSWORD=unichat psql -h localhost -U unichat -d unichat -f "$f"
          done

      - name: Seed E2E fixture corpus
        run: python scripts/seed_e2e_fixture.py

      - name: Start backend
        working-directory: backend
        run: |
          nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 > ../backend.log 2>&1 &
          timeout 60 bash -c 'until curl -sf http://localhost:8000/active-corpus; do sleep 1; done'

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run build

      - name: Start frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: |
          nohup npm run start -- -p 3000 > ../frontend.log 2>&1 &
          timeout 60 bash -c 'until curl -sf http://localhost:3000; do sleep 1; done'

      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: e2e
        env:
          E2E_ADMIN_KEY: e2e-admin-key
          E2E_BASE_URL: http://localhost:3000
        run: npm test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

      - name: Upload server logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-logs
          path: |
            backend.log
            frontend.log
          retention-days: 7

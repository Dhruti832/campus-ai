[pytest]
# Lets `pytest` work from the repo root too, not just from backend/ (CI and
# local dev both cd into backend/ already — this is for the plan's explicit
# "pytest runs cleanly from repo root" requirement). backend/pyproject.toml
# stays the authoritative config for cwd=backend/ invocations; pytest picks
# whichever ini file is nearest to the invocation directory.
testpaths = backend/tests
pythonpath = backend
markers =
    unit: mark a test as a unit test
    integration: mark a test as an integration test (requires a real Postgres)
